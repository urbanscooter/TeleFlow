name: Inspect Telegram iOS Structure

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TeleFlow
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '1'

      - name: Inspect structure
        run: |
          set +e
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  1. КЛАССЫ НАСТРОЕК (Settings Controllers)                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          find . -name "*.swift" 2>/dev/null | xargs grep -l "SettingsController\|SettingsScreen" 2>/dev/null | grep -i "settings" | head -30
          echo ""
          echo "--- Прямые объявления классов Settings ---"
          grep -rn "^class.*Settings.*Controller\|^final class.*Settings.*Controller\|@objc.*class.*Settings.*Controller" --include="*.swift" . 2>/dev/null | head -20
          echo ""
          echo "--- SettingsItem / SettingsSection ---"
          grep -rn "struct SettingsItem\|enum SettingsSection\|class SettingsController" --include="*.swift" . 2>/dev/null | head -20

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  2. POSTBOX — функция удаления сообщений                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "--- BUILD-файл Postbox ---"
          cat submodules/Postbox/BUILD 2>/dev/null | head -40
          echo ""
          echo "--- deleteMessages в Postbox.swift ---"
          grep -n "func deleteMessages\|deleteMessages(" submodules/Postbox/Sources/Postbox.swift 2>/dev/null | head -20
          echo ""
          echo "--- MessageId структура ---"
          grep -rn "public struct MessageId\|struct MessageId" --include="*.swift" submodules/Postbox/ 2>/dev/null | head -5

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  3. РЕКЛАМА (Sponsored Messages)                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "--- AdMessages.swift — где sponsoredMessages ---"
          grep -n "sponsoredMessages\|sponsoredMessage\|isSponsored" submodules/TelegramCore/Sources/TelegramEngine/Messages/AdMessages.swift 2>/dev/null | head -30
          echo ""
          echo "--- BUILD-файл TelegramCore ---"
          head -60 submodules/TelegramCore/BUILD 2>/dev/null

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  4. ИСТОРИИ (Stories)                                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "--- Файлы Stories ---"
          find . -name "*Stories*.swift" 2>/dev/null | grep -v test | head -30
          echo ""
          echo "--- Классы с Stories ---"
          grep -rn "class.*Stories.*Controller\|class.*Stories.*Screen\|class.*Stories.*Node" --include="*.swift" submodules/TelegramUI/ 2>/dev/null | head -20
          echo ""
          echo "--- Где отображается Stories panel в ChatList ---"
          grep -rn "storiesPanel\|StoriesPanel\|storiesContainer" --include="*.swift" submodules/TelegramUI/ 2>/dev/null | head -15

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  5. UI ЧАТА (для антиудаления + прозрачности)              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "--- ChatMessageItemView / Cell ---"
          find . -name "ChatMessageItem*.swift" 2>/dev/null | head -10
          echo ""
          echo "--- Классы с MessageBubble ---"
          grep -rn "class.*MessageBubble\|class.*ChatMessageItemView" --include="*.swift" submodules/TelegramUI/ 2>/dev/null | head -15

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  6. ГЛАВНЫЙ ТАРГЕТ (Telegram/BUILD)                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "--- Первые 100 строк Telegram/BUILD ---"
          head -100 Telegram/BUILD 2>/dev/null
          echo ""
          echo "--- Таргет Swiftgram ---"
          grep -n -A 5 "name = \"Swiftgram\"" Telegram/BUILD 2>/dev/null

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  7. УЖЕ СУЩЕСТВУЮЩИЕ МОДУЛИ Swiftgram (для примера)        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          find . -maxdepth 3 -type d -name "SG*" 2>/dev/null | head -30
          echo ""
          echo "--- SG-модули в submodules ---"
          ls -d submodules/SG* 2>/dev/null
          echo ""
          echo "--- Swiftgram/BUILD файлы ---"
          find . -path "*Swiftgram*BUILD" -o -path "*SGSettings*" 2>/dev/null | head -20

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ГОТОВО                                                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
