name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Prepare Cache Directory
        run: mkdir -p /private/var/tmp/bazel_disk_cache

      - name: Restore Bazel Disk Cache
        uses: actions/cache/restore@v4
        with:
          path: /private/var/tmp/bazel_disk_cache
          key: bazel-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-

      - name: Setup codesigning keychain
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import build-system/fake-codesigning/certs/SelfSigned.p12 -k build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Patch Code, Entitlements and Generate variables.bzl
        run: |
          # 1. Автопатч иконки в настройках TeleFlow
          sed -i '' 's/PresentationResourcesSettings.privacy/nil/g' submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift || true

          # 2. Мягкий обход проверки aps-environment (не ломая остальную логику генерации)
          python3 -c '
          import os

          for root, _, files in os.walk("build-system/Make"):
              for file in files:
                  if file.endswith(".py"):
                      fp = os.path.join(root, file)
                      with open(fp, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()

                      if "Could not find a valid aps-environment entitlement" in content or "aps-environment" in content:
                          import re
                          # Заменяем только raise, не прерывая выполнение функции через return
                          content = re.sub(r"raise\s+[a-zA-Z0-9_\.]*Exception\([^)]*aps-environment[^)]*\)", "pass", content, flags=re.DOTALL)
                          content = re.sub(r"raise\s+[a-zA-Z0-9_\.]*Exception\([^)]*Could not find[^)]*\)", "pass", content, flags=re.DOTALL)
                          
                          with open(fp, "w", encoding="utf-8") as f:
                              f.write(content)
                          print(f"Bypassed raise in: {fp}")
          '

          # 3. Инжектируем фиктивный variables.bzl в корень и в build_configuration на случай прямого резолва Bazel
          python3 -c '
          import json, os

          bzl_content = """
          telegram_bundle_id = "org.telegram.Telegram-iOS"
          telegram_api_id = "8"
          telegram_api_hash = "7245de8e747a0d6fbe11f7cc14fcc0bb"
          telegram_build_number = "{build_number}"
          telegram_is_internal_build = False
          telegram_is_appstore_build = False
          telegram_app_center_id = ""
          telegram_aps_environment = "development"
          """.format(build_number="${{ github.run_number }}")

          # Создаем в корне и в возможных папках расширений bzlmod
          paths = [
              "variables.bzl",
              "build-input/variables.bzl",
              "build-system/variables.bzl"
          ]
          for p in paths:
              os.makedirs(os.path.dirname(p) if os.path.dirname(p) else ".", exist_ok=True)
              with open(p, "w") as f:
                  f.write(bzl_content)
              print(f"Created {p}")
          '

      - name: Build the App
        run: |
          python3 build-system/Make/Make.py \
            --verbose \
            --overrideXcodeVersion \
            build \
            --buildNumber=${{ github.run_number }} \
            --configuration=release_arm64 \
            --configurationPath=build-system/template_minimal_development_configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning

      - name: Save Bazel Disk Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /private/var/tmp/bazel_disk_cache
          key: bazel-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find bazel-out -type d -name "Telegram.app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Telegram.app not found!"
            exit 1
          fi
          cp -R "$APP_DIR" Payload/
          zip -qr TeleFlow.ipa Payload

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TeleFlow v1.0.${{ github.run_number }}
          files: TeleFlow.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
