name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Prepare Cache Directory
        run: mkdir -p /private/var/tmp/bazel_disk_cache

      - name: Restore Bazel Disk Cache
        uses: actions/cache/restore@v4
        with:
          path: /private/var/tmp/bazel_disk_cache
          key: bazel-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-

      - name: Setup codesigning keychain
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import build-system/fake-codesigning/certs/SelfSigned.p12 -k build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Patch PeerInfoSettingsItems icon
        run: |
          sed -i '' 's/PresentationResourcesSettings.privacy/nil/g' submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift || true

      - name: Patch BuildConfiguration to Inject APNs Entitlement
        run: |
          python3 -c '
          import os

          target_file = "build-system/Make/BuildConfiguration.py"
          with open(target_file, "r", encoding="utf-8") as f:
              content = f.read()

          # Инжектируем aps-environment непосредственно перед проверкой
          search_str = "Could not find a valid aps-environment entitlement"
          if search_str in content:
              # Находим блок с raise и заменяем его на принудительную установку значения
              lines = content.splitlines()
              new_lines = []
              for line in lines:
                  if search_str in line:
                      indent = " " * (len(line) - len(line.lstrip()))
                      new_lines.append(indent + "entitlements[\"aps-environment\"] = \"development\"")
                      new_lines.append(indent + "print(\"[CI-PATCH] Injected aps-environment: development\")")
                  else:
                      new_lines.append(line)
              
              with open(target_file, "w", encoding="utf-8") as f:
                  f.write("\n".join(new_lines) + "\n")
              print("Successfully patched BuildConfiguration.py via line injection")
          else:
              print("Target string not found, doing broad replacement")
              import re
              content = re.sub(r"raise\s+Exception\([^)]*aps-environment[^)]*\)", "pass", content)
              with open(target_file, "w", encoding="utf-8") as f:
                  f.write(content)
          '

      - name: Build the App
        run: |
          python3 build-system/Make/Make.py \
            --verbose \
            --overrideXcodeVersion \
            build \
            --buildNumber=${{ github.run_number }} \
            --configuration=release_arm64 \
            --configurationPath=build-system/template_minimal_development_configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning

      - name: Save Bazel Disk Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /private/var/tmp/bazel_disk_cache
          key: bazel-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find bazel-out -type d -name "Telegram.app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Telegram.app not found!"
            exit 1
          fi
          cp -R "$APP_DIR" Payload/
          zip -qr TeleFlow.ipa Payload

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TeleFlow v1.0.${{ github.run_number }}
          files: TeleFlow.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
