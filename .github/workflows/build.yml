name: CI

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      # 1. Очистка диска раннера от лишних данных
      - name: Free Disk Space
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          df -h

      # 2. Выбор версии Xcode
      - name: Set active Xcode path
        run: |
          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          else
            echo "Xcode 26.2 not found under standard path, using default latest Xcode"
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      # 3. Кэш скомпилированных артефактов Bazel
      - name: Cache Bazel Disk Cache
        uses: actions/cache@v4
        with:
          path: /private/var/tmp/bazel_disk_cache
          key: bazel-disk-cache-${{ runner.os }}-${{ hashFiles('versions.json', 'WORKSPACE', 'submodules/**/BUILD*') }}
          restore-keys: |
            bazel-disk-cache-${{ runner.os }}-

      # 4. Создание рабочей директории
      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo mkdir -p /private/var/tmp/bazel_disk_cache
          sudo chmod -R 777 /private/var/tmp/bazel_disk_cache
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv /Users/Shared/$(basename "$GITHUB_WORKSPACE") /Users/Shared/telegram-ios

      # 5. Сборка приложения
      - name: Build the App
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          BAZEL_DISK_CACHE="/private/var/tmp/bazel_disk_cache"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);' 2>/dev/null || echo "11.0")
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_DISK_CACHE" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            if [ -f "$f" ]; then
              cp "$f" $OUTPUT_PATH/TeleFlow.ipa
            fi
          done

      # 6. Публикация IPA-артефакта в релизы
      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: TeleFlow ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Сборка TeleFlow iOS:
            - Меню настроек TeleFlow
            - Анти-удаление сообщений
            - Скрытие рекламы
            - Скрытие историй
          draft: false
          prerelease: false
          files: /Users/Shared/telegram-ios/build/artifacts/TeleFlow.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
