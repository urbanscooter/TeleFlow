name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Install Official Bazel Binary
        run: |
          # Скачиваем официальный бинарник Bazel 8 (arm64)
          curl -fL -o bazel-bin https://github.com/bazelbuild/bazel/releases/download/8.0.0/bazel-8.0.0-darwin-arm64
          chmod +x bazel-bin
          sudo mv bazel-bin /usr/local/bin/bazel
          
          # Проверяем, что выводится строго одна строка с версией
          /usr/local/bin/bazel --version
          
          mkdir -p build-input
          cp /usr/local/bin/bazel build-input/bazel-8.4.2-darwin-arm64
          chmod +x build-input/bazel-8.4.2-darwin-arm64

      - name: Restore Bazel Disk Cache
        uses: actions/cache/restore@v4
        with:
          path: /private/var/tmp/bazel_disk_cache
          key: bazel-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-

      - name: Setup codesigning keychain
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import build-system/fake-codesigning/certs/SelfSigned.p12 -k build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Patch Code and BuildConfiguration
        run: |
          # Патч сломанной иконки настроек TeleFlow
          sed -i '' 's/PresentationResourcesSettings.privacy/nil/g' submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift || true
          
          # Отключение строгой проверки aps-environment в Make-скриптах
          python3 -c "
          path = 'build-system/Make/BuildConfiguration.py'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('raise Exception(\"Could not find a valid aps-environment entitlement', 'print(\"Skipping aps-environment check\"); pass #')
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Build the App
        run: |
          python3 build-system/Make/Make.py \
            --overrideBazelVersion \
            --overrideXcodeVersion \
            build \
            --buildNumber=${{ github.run_number }} \
            --configuration=release_arm64 \
            --configurationPath=build-system/template_minimal_development_configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning

      - name: Save Bazel Disk Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /private/var/tmp/bazel_disk_cache
          key: bazel-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find bazel-out -type d -name "Telegram.app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Telegram.app not found!"
            exit 1
          fi
          cp -R "$APP_DIR" Payload/
          zip -qr TeleFlow.ipa Payload

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TeleFlow v1.0.${{ github.run_number }}
          files: TeleFlow.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
