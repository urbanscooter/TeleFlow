name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Restore Bazel Disk Cache
        uses: actions/cache/restore@v4
        with:
          path: /private/var/tmp/bazel_disk_cache
          key: bazel-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-

      - name: Setup codesigning keychain
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import build-system/fake-codesigning/certs/SelfSigned.p12 -k build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Patch PeerInfoSettingsItems icon
        run: |
          sed -i '' 's/PresentationResourcesSettings.privacy/nil/g' submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift

      - name: Build the App
        run: |
          python3 build-system/Make/Make.py \
            --bazel-path=build-input/bazel-8.4.2-darwin-arm64 \
            build \
            --configurationPath=build-system/template_minimal_development_configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning

      - name: Save Bazel Disk Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /private/var/tmp/bazel_disk_cache
          key: bazel-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R bazel-out/applebin_ios-ios_arm64-opt-ST-*/bin/Telegram/Telegram.app Payload/
          zip -qr TeleFlow.ipa Payload

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TeleFlow v1.0.${{ github.run_number }}
          files: TeleFlow.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
