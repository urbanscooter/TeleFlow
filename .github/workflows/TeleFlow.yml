name: Build TeleFlow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout TeleFlow
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Create TeleFlow Module and Apply Patches
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          cd $SOURCE_DIR

          # 1. Создаём структуру модуля TeleFlow
          mkdir -p TeleFlowModule/Sources
          
          # 2. Создаём BUILD-файл для модуля (описание для Bazel)
          cat > TeleFlowModule/BUILD << 'EOF'
          load("@build_bazel_rules_swift//swift:swift.bzl", "swift_library")

          swift_library(
              name = "TeleFlow",
              srcs = glob(["Sources/**/*.swift"]),
              module_name = "TeleFlow",
              visibility = ["//visibility:public"],
              deps = [
                  "//submodules/TelegramCore:TelegramCore",
                  "//submodules/TelegramUI:TelegramUI",
                  "//submodules/Postbox:Postbox",
              ],
          )
          EOF

          # 3. Создаём основной код модуля (Реализация функций)
          cat > TeleFlowModule/Sources/TeleFlow.swift << 'EOF'
          import Foundation
          import TelegramCore
          import TelegramUI
          import Postbox

          public final class TeleFlowManager {
              public static let shared = TeleFlowManager()
              private init() {}

              // Настройки (тумблеры)
              public var hideAds: Bool {
                  get { UserDefaults.standard.bool(forKey: "teleflow.hideAds") }
                  set { UserDefaults.standard.set(newValue, forKey: "teleflow.hideAds") }
              }
              public var hideStories: Bool {
                  get { UserDefaults.standard.bool(forKey: "teleflow.hideStories") }
                  set { UserDefaults.standard.set(newValue, forKey: "teleflow.hideStories") }
              }
              public var antiDelete: Bool {
                  get { UserDefaults.standard.bool(forKey: "teleflow.antiDelete") }
                  set { UserDefaults.standard.set(newValue, forKey: "teleflow.antiDelete") }
              }

              // Логика Антиудаления (сохранение удалённых сообщений)
              private var deletedMessages: [String: [MessageId]] = [:]
              
              public func storeDeletedMessages(_ messageIds: [MessageId], for peerId: PeerId) {
                  guard antiDelete else { return }
                  let key = "\(peerId.id._internalValue)"
                  var stored = deletedMessages[key] ?? []
                  stored.append(contentsOf: messageIds)
                  deletedMessages[key] = stored
              }
              
              public func getDeletedMessages(for peerId: PeerId) -> [MessageId] {
                  let key = "\(peerId.id._internalValue)"
                  return deletedMessages[key] ?? []
              }
          }
          EOF

          # 4. Подключаем модуль к основному проекту (добавляем в deps)
          # Ищем файл с определением основного таргета и добавляем зависимость
          MAIN_BUILD_FILE=$(grep -rl 'name = "Telegram"' --include="BUILD" . | head -1)
          if [ -n "$MAIN_BUILD_FILE" ]; then
            # Добавляем зависимость после строки с "deps = ["
            sed -i '/deps = \[/a\        "//TeleFlowModule:TeleFlow",' "$MAIN_BUILD_FILE"
          fi

          # 5. Применяем патчи для активации функций
          
          # Патч 1: Скрытие рекламы (в AdMessages.swift)
          PATCH_FILE_AD="submodules/TelegramCore/Sources/TelegramEngine/Messages/AdMessages.swift"
          if [ -f "$PATCH_FILE_AD" ]; then
            # Добавляем проверку hideAds перед обработкой sponsoredMessages
            sed -i 's/let (postsBetween, startDelay, betweenDelay, messages, chats, users) = (sponsoredMessagesData.postsBetween, sponsoredMessagesData.startDelay, sponsoredMessagesData.betweenDelay, sponsoredMessagesData.messages, sponsoredMessagesData.chats, sponsoredMessagesData.users)/if TeleFlowManager.shared.hideAds { continue }\n                        let (postsBetween, startDelay, betweenDelay, messages, chats, users) = (sponsoredMessagesData.postsBetween, sponsoredMessagesData.startDelay, sponsoredMessagesData.betweenDelay, sponsoredMessagesData.messages, sponsoredMessagesData.chats, sponsoredMessagesData.users)/' "$PATCH_FILE_AD"
          fi

          # Патч 2: Скрытие историй (пример, требует точного поиска файла)
          # В реальном коде нужно найти место рендеринга панели историй и добавить проверку hideStories
          # Например: если TeleFlowManager.shared.hideStories { return }
          
          # Патч 3: Антиудаление (в Postbox.swift)
          PATCH_FILE_PB="submodules/Postbox/Sources/Postbox.swift"
          if [ -f "$PATCH_FILE_PB" ]; then
            # Добавляем сохранение ID сообщений перед удалением
            sed -i 's/fileprivate func deleteMessages(_ messageIds: \[MessageId\], forEachMedia: ((Media) -> Void)?) {/fileprivate func deleteMessages(_ messageIds: [MessageId], forEachMedia: ((Media) -> Void)?) {\n        if TeleFlowManager.shared.antiDelete {\n            for messageId in messageIds {\n                TeleFlowManager.shared.storeDeletedMessages([messageId], for: messageId.peerId)\n            }\n        }/' "$PATCH_FILE_PB"
          fi

          echo "TeleFlow module created and patches applied."

      - name: Build the App
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd $SOURCE_DIR
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" $OUTPUT_PATH/
          done
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          release_name: TeleFlow ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            An unsigned build of TeleFlow for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          draft: false
          prerelease: false

      - name: Upload Release IPA
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          asset_name: TeleFlow.ipa
          asset_content_type: application/zip

      - name: Upload Release DSYM
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          asset_name: TeleFlow.DSYMs.zip
          asset_content_type: application/zip
