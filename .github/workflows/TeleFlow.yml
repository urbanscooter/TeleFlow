name: Build TeleFlow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout TeleFlow
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Create TeleFlow Module and Apply Patches
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          cd $SOURCE_DIR

          mkdir -p TeleFlowModule/Sources

          cat > TeleFlowModule/BUILD << 'BUILDEOF'
          load("@build_bazel_rules_swift//swift:swift.bzl", "swift_library")

          swift_library(
              name = "TeleFlow",
              srcs = glob(["Sources/**/*.swift"]),
              module_name = "TeleFlow",
              visibility = ["//visibility:public"],
          )
          BUILDEOF

          cat > TeleFlowModule/Sources/TeleFlow.swift << 'SWIFTEOF'
          import Foundation

          public final class TeleFlowManager {
              public static let shared = TeleFlowManager()
              private init() {}

              public var hideAds: Bool {
                  get { UserDefaults.standard.bool(forKey: "teleflow.hideAds") }
                  set { UserDefaults.standard.set(newValue, forKey: "teleflow.hideAds") }
              }
              public var hideStories: Bool {
                  get { UserDefaults.standard.bool(forKey: "teleflow.hideStories") }
                  set { UserDefaults.standard.set(newValue, forKey: "teleflow.hideStories") }
              }
              public var antiDelete: Bool {
                  get { UserDefaults.standard.bool(forKey: "teleflow.antiDelete") }
                  set { UserDefaults.standard.set(newValue, forKey: "teleflow.antiDelete") }
              }
          }
          SWIFTEOF

          echo "=== Файлы модуля созданы ==="

          add_dep_to_build() {
            local BUILD_FILE="$1"
            if [ ! -f "$BUILD_FILE" ]; then
              echo "Файл $BUILD_FILE не найден, пропускаем"
              return
            fi
            python3 - "$BUILD_FILE" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path, "r") as f:
              lines = f.read().split("\n")
          if any('//TeleFlowModule:TeleFlow' in l for l in lines):
              print(f"{path}: зависимость уже есть")
              sys.exit(0)
          inserted = False
          for i, line in enumerate(lines):
              if 'deps = [' in line:
                  lines.insert(i + 1, '    "//TeleFlowModule:TeleFlow",')
                  inserted = True
                  print(f"{path}: зависимость добавлена на строке {i+1}")
                  break
          if not inserted:
              print(f"{path}: не нашли deps = [")
              sys.exit(1)
          with open(path, "w") as f:
              f.write("\n".join(lines))
          PYEOF
          }

          add_dep_to_build "submodules/Postbox/BUILD"
          add_dep_to_build "submodules/TelegramCore/BUILD"

          python3 - << 'PYEOF'
          import re
          build_file = "Telegram/BUILD"
          with open(build_file, "r") as f:
              content = f.read()
          lines = content.split("\n")
          if any('//TeleFlowModule:TeleFlow' in l for l in lines):
              print("Telegram/BUILD: зависимость уже есть")
          else:
              target_start = None
              for i, line in enumerate(lines):
                  if re.search(r'name\s*=\s*"Swiftgram"', line):
                      target_start = i
                      break
              if target_start is None:
                  for i, line in enumerate(lines):
                      if re.search(r'name\s*=\s*"Telegram"', line):
                          target_start = i
                          break
              if target_start is not None:
                  for j in range(target_start, len(lines)):
                      if 'deps = [' in lines[j]:
                          lines.insert(j + 1, '        "//TeleFlowModule:TeleFlow",')
                          with open(build_file, "w") as f:
                              f.write("\n".join(lines))
                          print(f"Telegram/BUILD: зависимость добавлена на строке {j+1}")
                          break
          PYEOF

          POSTBOX_FILE="submodules/Postbox/Sources/Postbox.swift"
          if [ -f "$POSTBOX_FILE" ]; then
            if ! grep -q "^import TeleFlow" "$POSTBOX_FILE"; then
              perl -i -pe 'BEGIN{$done=0} if (!$done && /^import /) { $_ .= "import TeleFlow\n"; $done=1; }' "$POSTBOX_FILE"
              echo "import TeleFlow добавлен в Postbox.swift"
            fi
            if ! grep -q "teleflow.antiDelete" "$POSTBOX_FILE"; then
              perl -i -pe 's/fileprivate func deleteMessages\(_ messageIds: \[MessageId\], forEachMedia: \(\(Media\) -> Void\)\?\) \{/fileprivate func deleteMessages(_ messageIds: [MessageId], forEachMedia: ((Media) -> Void)?) {\n        if TeleFlowManager.shared.antiDelete {\n            \/\/ TODO: сохранить удалённые сообщения\n        }/' "$POSTBOX_FILE"
              echo "Патч антиудаления применён в Postbox.swift"
            fi
          fi

          echo "=== ГОТОВО ==="

      - name: Build the App
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 - << 'PYEOF'
          import json
          path = "build-system/appstore-configuration.json"
          with open(path) as f:
              cfg = json.load(f)
          if "sg_config" not in cfg:
              sg_branding = {
                  "app_name": "TeleFlow",
                  "bundle_id": cfg.get("bundle_id", "ph.telegra.Telegraph"),
                  "app_specific_url_scheme": cfg.get("app_specific_url_scheme", "teleflow"),
                  "premium_iap_product_id": cfg.get("premium_iap_product_id", ""),
              }
              cfg["sg_config"] = json.dumps(sg_branding, separators=(',', ':'))
              with open(path, "w") as f:
                  json.dump(cfg, f, indent=2)
              print("sg_config добавлен")
          PYEOF

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          echo "=== Содержимое bazel-bin/Telegram/ ==="
          ls -la bazel-bin/Telegram/ 2>/dev/null | head -30

          echo "=== Поиск .ipa через find -L bazel-bin ==="
          find -L bazel-bin -maxdepth 4 -name "*.ipa" 2>/dev/null

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          IPA_SRC=""
          IPA_SRC=$(find -L bazel-bin -maxdepth 4 -name "*.ipa" 2>/dev/null | head -1)

          if [ -z "$IPA_SRC" ] && [ -f "bazel-bin/Telegram/Swiftgram.ipa" ]; then
            IPA_SRC="bazel-bin/Telegram/Swiftgram.ipa"
          fi

          if [ -n "$IPA_SRC" ] && [ -f "$IPA_SRC" ]; then
            cp "$IPA_SRC" "$OUTPUT_PATH/TeleFlow.ipa"
            echo "=== Скопирован IPA: $IPA_SRC -> TeleFlow.ipa ==="
          else
            echo "=== ОШИБКА: .ipa не найден ==="
            echo "=== Содержимое bazel-bin/Telegram/ ==="
            ls -la bazel-bin/Telegram/ 2>/dev/null || echo "bazel-bin/Telegram не существует"
            exit 1
          fi

          echo "=== Содержимое build/artifacts ==="
          ls -la "$OUTPUT_PATH/"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          release_name: TeleFlow ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            An unsigned build of TeleFlow for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          draft: false
          prerelease: false

      - name: Upload Release IPA
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/TeleFlow.ipa
          asset_name: TeleFlow.ipa
          asset_content_type: application/zip
