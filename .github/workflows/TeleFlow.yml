name: Build TeleFlow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout TeleFlow
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Create TeleFlow Module and Apply Patches
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          cd $SOURCE_DIR

          mkdir -p TeleFlowModule/Sources

          cat > TeleFlowModule/BUILD << 'BUILDEOF'
          load("@build_bazel_rules_swift//swift:swift.bzl", "swift_library")

          swift_library(
              name = "TeleFlow",
              srcs = glob(["Sources/**/*.swift"]),
              module_name = "TeleFlow",
              visibility = ["//visibility:public"],
              deps = [
                  "//submodules/TelegramCore:TelegramCore",
                  "//submodules/TelegramUI:TelegramUI",
                  "//submodules/Postbox:Postbox",
              ],
          )
          BUILDEOF

          cat > TeleFlowModule/Sources/TeleFlow.swift << 'SWIFTEOF'
          import Foundation
          import TelegramCore
          import TelegramUI
          import Postbox

          public final class TeleFlowManager {
              public static let shared = TeleFlowManager()
              private init() {}

              public var hideAds: Bool {
                  get { UserDefaults.standard.bool(forKey: "teleflow.hideAds") }
                  set { UserDefaults.standard.set(newValue, forKey: "teleflow.hideAds") }
              }
              public var hideStories: Bool {
                  get { UserDefaults.standard.bool(forKey: "teleflow.hideStories") }
                  set { UserDefaults.standard.set(newValue, forKey: "teleflow.hideStories") }
              }
              public var antiDelete: Bool {
                  get { UserDefaults.standard.bool(forKey: "teleflow.antiDelete") }
                  set { UserDefaults.standard.set(newValue, forKey: "teleflow.antiDelete") }
              }

              private var deletedMessages: [String: [MessageId]] = [:]

              public func storeDeletedMessages(_ messageIds: [MessageId], for peerId: PeerId) {
                  guard antiDelete else { return }
                  let key = "\(peerId.id._internalValue)"
                  var stored = deletedMessages[key] ?? []
                  stored.append(contentsOf: messageIds)
                  deletedMessages[key] = stored
              }

              public func getDeletedMessages(for peerId: PeerId) -> [MessageId] {
                  let key = "\(peerId.id._internalValue)"
                  return deletedMessages[key] ?? []
              }
          }
          SWIFTEOF

          echo "=== Файлы модуля созданы ==="
          ls -la TeleFlowModule/
          ls -la TeleFlowModule/Sources/

          echo "=== Поиск главного BUILD ==="
          find . -maxdepth 2 -name "BUILD" -path "*Telegram*" 2>/dev/null | head -10

          MAIN_BUILD_FILE="Telegram/BUILD"
          if [ ! -f "$MAIN_BUILD_FILE" ]; then
            MAIN_BUILD_FILE=$(find . -maxdepth 2 -name "BUILD" -path "*Telegram*" 2>/dev/null | head -1)
          fi
          echo "MAIN_BUILD_FILE=$MAIN_BUILD_FILE"

          if [ -n "$MAIN_BUILD_FILE" ] && [ -f "$MAIN_BUILD_FILE" ]; then
            if ! grep -q "//TeleFlowModule:TeleFlow" "$MAIN_BUILD_FILE"; then
              perl -i -pe 's/^(\s*)deps = \[/$1deps = [\n$1    "\/\/TeleFlowModule:TeleFlow",/' "$MAIN_BUILD_FILE"
              echo "=== Модуль подключён ==="
            fi
          fi

          PATCH_FILE_AD="submodules/TelegramCore/Sources/TelegramEngine/Messages/AdMessages.swift"
          if [ -f "$PATCH_FILE_AD" ]; then
            if ! grep -q "teleflow.hideAds" "$PATCH_FILE_AD"; then
              perl -i -pe 's/let \(postsBetween, startDelay, betweenDelay, messages, chats, users\) = \(sponsoredMessagesData\.postsBetween, sponsoredMessagesData\.startDelay, sponsoredMessagesData\.betweenDelay, sponsoredMessagesData\.messages, sponsoredMessagesData\.chats, sponsoredMessagesData\.users\)/if TeleFlowManager.shared.hideAds { continue }\n                        let (postsBetween, startDelay, betweenDelay, messages, chats, users) = (sponsoredMessagesData.postsBetween, sponsoredMessagesData.startDelay, sponsoredMessagesData.betweenDelay, sponsoredMessagesData.messages, sponsoredMessagesData.chats, sponsoredMessagesData.users)/' "$PATCH_FILE_AD"
              echo "=== Патч рекламы применён ==="
            fi
          fi

          PATCH_FILE_PB="submodules/Postbox/Sources/Postbox.swift"
          if [ -f "$PATCH_FILE_PB" ]; then
            if ! grep -q "teleflow.antiDelete" "$PATCH_FILE_PB"; then
              perl -i -pe 's/fileprivate func deleteMessages\(_ messageIds: \[MessageId\], forEachMedia: \(\(Media\) -> Void\)\?\) \{/fileprivate func deleteMessages(_ messageIds: [MessageId], forEachMedia: ((Media) -> Void)?) {\n        if TeleFlowManager.shared.antiDelete {\n            for messageId in messageIds {\n                TeleFlowManager.shared.storeDeletedMessages([messageId], for: messageId.peerId)\n            }\n        }/' "$PATCH_FILE_PB"
              echo "=== Патч антиудаления применён ==="
            fi
          fi

          echo "=== ГОТОВО ==="

      - name: Build the App
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 - << 'PYEOF'
          import json
          path = "build-system/appstore-configuration.json"
          with open(path) as f:
              cfg = json.load(f)

          if "sg_config" not in cfg:
              bundle_id = cfg.get("bundle_id", "com.teleflow.app")
              app_name = cfg.get("app_name", "TeleFlow")
              team_id = cfg.get("team_id", "")
              url_scheme = cfg.get("url_scheme", "teleflow")

              cfg["sg_config"] = {
                  "bundle_id": bundle_id,
                  "app_name": app_name,
                  "url_scheme": url_scheme,
                  "team_id": team_id,
                  "app_group_id": "group." + bundle_id,
                  "extension_bundle_suffix": ".Share",
                  "watch_bundle_suffix": ".WatchApp",
                  "widget_bundle_suffix": ".Widget",
                  "notifications_bundle_suffix": ".NotificationService",
                  "intents_bundle_suffix": ".Intents",
                  "share_bundle_suffix": ".Share",
              }

              with open(path, "w") as f:
                  json.dump(cfg, f, indent=2)

              print("sg_config добавлен:")
              print(json.dumps(cfg["sg_config"], indent=2))
          else:
              print("sg_config уже есть, пропускаем")

          print("\nФинальный конфиг:")
          print(json.dumps(cfg, indent=2))
          PYEOF

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" $OUTPUT_PATH/
          done

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          release_name: TeleFlow ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            An unsigned build of TeleFlow for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          draft: false
          prerelease: false

      - name: Upload Release IPA
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          asset_name: TeleFlow.ipa
          asset_content_type: application/zip
